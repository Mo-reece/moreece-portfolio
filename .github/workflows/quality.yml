name: Site quality

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate markup references and metadata
        run: python scripts/validate_site.py

      - name: Reject oversized HTML
        shell: bash
        run: |
          bytes=$(wc -c < index.html)
          test "$bytes" -le 120000 || {
            echo "index.html is $bytes bytes; limit is 120000"
            exit 1
          }
