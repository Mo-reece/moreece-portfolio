<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; object-src 'none'; base-uri 'self'">
    <title>Page Not Found | Okurut Maurice Leonard</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background:#f0ece4; color:#0a0a0a; font:1rem/1.6 system-ui,sans-serif; }
        main { width:min(640px,100%); }
        p:first-child { color:#8a6318; font-weight:800; letter-spacing:.18em; text-transform:uppercase; }
        h1 { font-size:clamp(3rem,12vw,7rem); line-height:.9; margin:12px 0 24px; }
        a { display:inline-block; margin-top:18px; padding:13px 20px; background:#0a0a0a; color:#f0ece4; font-weight:700; text-decoration:none; }
        a:focus-visible { outline:3px solid #c0392b; outline-offset:3px; }
    </style>
</head>
<body>
    <main>
        <p>Error 404</p>
        <h1>Page not found.</h1>
        <p>The address may have changed, or the page may no longer exist.</p>
        <a href="/moreece-portfolio/">Return to the portfolio</a>
    </main>
</body>
</html>
